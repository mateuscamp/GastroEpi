[project]
name = "gastroepi"
version = "0.2.0.dev0"
description = "Registro offline de colonoscopia e epidemiologia de câncer colorretal"
readme = "README.md"
authors = [{ name = "Mateus Campelo", email = "mateuscampelob@gmail.com" }]
requires-python = ">=3.13,<3.15"
dependencies = [
    "sqlcipher3>=0.6.4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

# ── Portões (ADR-0002) ────────────────────────────────────────────────

[tool.poe.tasks.check]
help = "Checagem completa: rodar antes de declarar qualquer tarefa concluída"
sequence = [
  { cmd = "ruff format --check ." },
  { cmd = "ruff check ." },
  { cmd = "mypy" },
  { cmd = "lint-imports" },
  { cmd = "pytest --cov --cov-report=term-missing:skip-covered" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Princípio I: a suíte inteira roda sem rede; um teste que abra socket falha.
addopts = ["--disable-socket", "--strict-markers", "-q"]
markers = [
  "referencia: teste estatístico com valor de referência citado (R, Epi Info ou artigo)",
]

[tool.coverage.run]
branch = true
source = ["gastroepi"]

[tool.coverage.report]
fail_under = 90
skip_empty = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "ferramentas"]

# Só para o editor achar a .venv; o portão de tipos é o mypy.
[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["src-tauri", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# ── Fronteiras (ADR-0002, ADR-0003) ───────────────────────────────────
# Contratos com allow_indirect_imports barram só o import direto: a casca chega
# ao banco por servicos → persistencia, e isso é o caminho permitido.

[tool.importlinter]
root_package = "gastroepi"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ADR-0002: o núcleo não conhece a interface"
type = "forbidden"
source_modules = [
  "gastroepi.dominio",
  "gastroepi.cofre",
  "gastroepi.auditoria",
  "gastroepi.persistencia",
  "gastroepi.estatistica",
  "gastroepi.exportacao",
  "gastroepi.servicos",
]
forbidden_modules = ["PySide6", "gastroepi.ui_qt", "gastroepi.cli"]

[[tool.importlinter.contracts]]
name = "ADR-0002: as cascas só entram no núcleo por servicos"
type = "forbidden"
source_modules = ["gastroepi.ui_qt", "gastroepi.cli"]
forbidden_modules = [
  "gastroepi.cofre",
  "gastroepi.auditoria",
  "gastroepi.persistencia",
  "sqlcipher3",
  "sqlite3",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ADR-0002: dominio não importa outro módulo do projeto"
type = "forbidden"
source_modules = ["gastroepi.dominio"]
forbidden_modules = [
  "gastroepi.cofre",
  "gastroepi.auditoria",
  "gastroepi.persistencia",
  "gastroepi.estatistica",
  "gastroepi.exportacao",
  "gastroepi.servicos",
  "gastroepi.ui_qt",
  "gastroepi.cli",
]

[[tool.importlinter.contracts]]
name = "ADR-0002: estatistica e exportacao importam só dominio"
type = "forbidden"
source_modules = ["gastroepi.estatistica", "gastroepi.exportacao"]
forbidden_modules = [
  "gastroepi.cofre",
  "gastroepi.auditoria",
  "gastroepi.persistencia",
  "gastroepi.servicos",
  "gastroepi.ui_qt",
  "gastroepi.cli",
  "sqlcipher3",
  "sqlite3",
]

[[tool.importlinter.contracts]]
name = "ADR-0002: auditoria é pura (quem grava é persistencia)"
type = "forbidden"
source_modules = ["gastroepi.auditoria"]
forbidden_modules = [
  "gastroepi.persistencia",
  "gastroepi.servicos",
  "gastroepi.ui_qt",
  "gastroepi.cli",
  "sqlcipher3",
  "sqlite3",
]

[[tool.importlinter.contracts]]
name = "ADR-0003: só persistencia abre o banco"
type = "forbidden"
source_modules = [
  "gastroepi.dominio",
  "gastroepi.cofre",
  "gastroepi.auditoria",
  "gastroepi.estatistica",
  "gastroepi.exportacao",
  "gastroepi.servicos",
  "gastroepi.ui_qt",
  "gastroepi.cli",
]
forbidden_modules = ["sqlcipher3", "sqlite3"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Princípio I: nenhum módulo usa rede"
type = "forbidden"
source_modules = ["gastroepi"]
forbidden_modules = ["socket", "http", "urllib", "ssl", "requests", "httpx"]
