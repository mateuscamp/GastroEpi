# Portões da reescrita em Python (ADR-0002, ADR-0003).
# Cada job corresponde a uma linha de Governança de um ADR; ao remover um, atualizar o ADR.
# O build.yml do Tauri continua até o corte (Fase 7).

name: python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checagem:
    name: checagem completa (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar (Python da .python-version, versões do uv.lock)
        run: uv sync --locked
      # ruff, mypy --strict, import-linter, pytest sem rede com cobertura ≥ 90%
      - name: Checagem completa
        run: uv run poe check

  oraculo-congelado:
    name: oráculo v0.1.16 congelado
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ADR-0002: src-tauri/ e o frontend TS são referência; não mudam até o corte.
      - name: Nenhuma mudança no código Tauri/TS
        run: |
          mudados=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- \
            src-tauri 'src/*.ts' 'src/*.tsx' 'src/*.css' src/assets \
            package.json package-lock.json index.html vite.config.ts 'tsconfig*.json' public)
          if [ -n "$mudados" ]; then
            echo "::error::o oráculo v0.1.16 é congelado (ADR-0002); mudanças em:"
            echo "$mudados"
            exit 1
          fi

  sonda-sqlcipher:
    name: sonda do SQLCipher congelado (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar
        run: uv sync --locked
      # ADR-0003: se isto falhar, o plano B é apsw-sqlite3mc, antes da Fase 2.
      - name: Congelar a sonda
        run: uv run --with pyinstaller pyinstaller --noconfirm --onedir --name sonda_sqlcipher ferramentas/sonda_sqlcipher.py
      - name: Rodar o executável congelado
        run: ./dist/sonda_sqlcipher/sonda_sqlcipher.exe
      - name: Tamanho da pasta congelada
        run: du -sh dist/sonda_sqlcipher

  dependencias:
    name: vulnerabilidades nas dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Substitui o cargo audit: dependência com vulnerabilidade conhecida não entra na main.
      - name: pip-audit sobre o uv.lock
        run: |
          uv export --locked --no-emit-project --no-hashes --format requirements-txt > requisitos.txt
          uvx pip-audit --strict -r requisitos.txt
